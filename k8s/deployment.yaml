apiVersion: apps/v1
kind: Deployment
metadata:
  name: conceptsos
  labels:
    app: conceptsos
spec:
  replicas: 1
  strategy:
    # SQLite backend forces a single replica; recreate on updates to avoid
    # two pods opening the DB at once.
    type: Recreate
  selector:
    matchLabels:
      app: conceptsos
  template:
    metadata:
      labels:
        app: conceptsos
    spec:
      containers:
        - name: conceptsos
          image: us-central1-docker.pkg.dev/conceptsos-prd/conceptsos/vpn:v1
          imagePullPolicy: Always
          ports:
            # Headscale HTTP API + client login. This is the ONLY port the
            # Service exposes; the Next.js app port (3000) is intentionally
            # unreachable except via the tailnet interface inside the pod.
            - name: headscale
              containerPort: 8080
          env:
            - name: HEADSCALE_SERVER_URL
              # Must be the URL tailnet clients will use to reach headscale.
              # Set to the Service's external LB address (see k8s/service.yaml).
              value: "http://35.224.100.12"
            - name: TS_HOSTNAME
              value: "conceptsos-app"
          # Real TUN device so Next.js can bind to the tailnet IP.
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/conceptsos-vpn
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          emptyDir: {}
