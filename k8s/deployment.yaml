apiVersion: apps/v1
kind: Deployment
metadata:
  name: conceptsos
  labels:
    app: conceptsos
spec:
  replicas: 1
  # Only one pod can hold the LB IP + wg0 peer table at a time. Rolling
  # would briefly double-bind and confuse WireGuard peers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: conceptsos
  template:
    metadata:
      labels:
        app: conceptsos
    spec:
      containers:
        - name: conceptsos
          image: us-central1-docker.pkg.dev/conceptsos-prd/conceptsos/app:latest
          imagePullPolicy: Always
          ports:
            - name: wg
              containerPort: 51820
              protocol: UDP
          # NET_ADMIN is required to create the wg0 interface and set routes.
          # Kernel WireGuard is used (built into GKE Container-Optimized OS
          # since GKE 1.24), so no /dev/net/tun mount is needed.
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: wg-config
              mountPath: /etc/wireguard-src
              readOnly: true
          # HTTP probes won't work because Next.js binds to the tunnel IP
          # only; use an exec probe against the wg interface instead.
          readinessProbe:
            exec:
              command: ["sh", "-c", "wg show wg0 >/dev/null"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "wg show wg0 >/dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: wg-config
          secret:
            secretName: wg-server
            defaultMode: 0400
            items:
              - key: wg0.conf
                path: wg0.conf
