apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy with:  kubectl apply -k k8s/
#
# To fork this for another customer, change:
#   - k8s/config.env      (domain + hostnames)
#   - images:             (registry / tag below)
# Nothing else should need touching.

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: conceptsos-config
    envs:
      - config.env

# Rewrites the placeholder `conceptsos-vpn` image reference in
# deployment.yaml to a real registry + tag. Bump `newTag` to roll out.
images:
  - name: conceptsos-vpn
    newName: us-central1-docker.pkg.dev/conceptsos-prd/conceptsos/vpn
    newTag: v2
