apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shared production control plane at https://hs.conceptsos.com.
# All customer app pods join this headscale.
#
# Deploy with:  kubectl apply -k k8s/overlays/control-prod/

namespace: conceptsos-control

resources:
  - namespace.yaml
  - ../../base/control

configMapGenerator:
  - name: control-config
    envs:
      - config.env

images:
  - name: conceptsos-vpn
    newName: us-central1-docker.pkg.dev/conceptsos-prd/conceptsos/vpn
    newTag: v4
