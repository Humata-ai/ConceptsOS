apiVersion: v1
kind: Service
metadata:
  name: conceptsos
  labels:
    app: conceptsos
spec:
  # Only the WireGuard endpoint is public. The Next.js app is bound to
  # the tunnel IP and unreachable from the internet.
  type: LoadBalancer
  selector:
    app: conceptsos
  ports:
    - name: wg
      port: 51820
      targetPort: 51820
      protocol: UDP
