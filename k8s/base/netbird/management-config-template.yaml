# management.json template, rendered into an emptyDir by the render-config
# initContainer using `envsubst`. Values come from:
#   - netbird-mgmt-config Secret / ConfigMap (NB_*)
#   - netbird-mgmt-secrets Secret (OIDC_*, TURN_SHARED_SECRET)
#
# SECURITY NOTE on IDP_MANAGER_TYPE:
#   "none"   — directory sync disabled. OIDC sign-in still enforced
#              (JWT + hd=humata.ai). Offboarding a Workspace user does
#              NOT auto-revoke their NetBird peer; delete manually in
#              the dashboard. Current P0 default.
#   "google" — full sync. Requires real GOOGLE_SERVICE_ACCOUNT_JSON
#              (base64) + domain-wide delegation. Flip back to this
#              before external-customer signup.
#
# Keep this in sync with upstream schema:
#   https://github.com/netbirdio/netbird/blob/main/management/server/config.go
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-management-json-tmpl
data:
  management.json.tmpl: |
    {
      "Stuns": [
        { "Proto": "udp", "URI": "stun:${NB_TURN_HOST}:3478", "Username": "", "Password": null }
      ],
      "TURNConfig": {
        "TimeBasedCredentials": true,
        "CredentialsTTL": "12h",
        "Secret": "${TURN_SHARED_SECRET}",
        "Turns": [
          { "Proto": "udp", "URI": "turn:${NB_TURN_HOST}:3478", "Username": "netbird", "Password": null }
        ]
      },
      "Signal": {
        "Proto": "https",
        "URI": "${NB_SIGNAL_HOST}:443",
        "Username": "",
        "Password": null
      },
      "Datadir": "/var/lib/netbird",
      "HttpConfig": {
        "Address": "0.0.0.0:33071",
        "AuthIssuer": "${OIDC_ISSUER}",
        "AuthAudience": "${OIDC_CLIENT_ID}",
        "AuthKeysLocation": "${OIDC_ISSUER}/.well-known/jwks.json",
        "AuthUserIDClaim": "email",
        "OIDCConfigEndpoint": "${OIDC_ISSUER}/.well-known/openid-configuration",
        "IdpSignKeyRefreshEnabled": true
      },
      "IdpManagerConfig": {
        "ManagerType": "${IDP_MANAGER_TYPE}",
        "ClientConfig": {
          "Issuer": "${OIDC_ISSUER}",
          "ClientID": "${OIDC_CLIENT_ID}",
          "ClientSecret": "${OIDC_CLIENT_SECRET}",
          "TokenEndpoint": "${OIDC_ISSUER}/token",
          "GrantType": "client_credentials"
        },
        "ExtraConfig": {
          "ServiceAccountKey": "${GOOGLE_SERVICE_ACCOUNT_JSON}",
          "CustomerId": "${GOOGLE_CUSTOMER_ID}"
        }
      },
      "DeviceAuthorizationFlow": {
        "Provider": "hosted",
        "ProviderConfig": {
          "Audience":     "${OIDC_CLIENT_ID}",
          "ClientID":     "${OIDC_CLIENT_ID}",
          "ClientSecret": "${OIDC_CLIENT_SECRET}",
          "Domain":       "${OIDC_DOMAIN}",
          "TokenEndpoint": "${OIDC_ISSUER}/token",
          "DeviceAuthEndpoint": "${OIDC_ISSUER}/device/code",
          "Scope": "openid profile email offline_access",
          "UseIDToken": false
        }
      },
      "PKCEAuthorizationFlow": {
        "ProviderConfig": {
          "Audience":            "${OIDC_CLIENT_ID}",
          "ClientID":            "${OIDC_CLIENT_ID}",
          "ClientSecret":        "${OIDC_CLIENT_SECRET}",
          "Domain":              "${OIDC_DOMAIN}",
          "AuthorizationEndpoint": "${OIDC_ISSUER}/authorize",
          "TokenEndpoint":         "${OIDC_ISSUER}/token",
          "Scope":                 "openid profile email offline_access",
          "RedirectURLs":          ["https://${NB_MGMT_HOST}/auth/callback", "https://${NB_MGMT_HOST}/silent-auth"],
          "UseIDToken":            false
        }
      },
      "StoreConfig": { "Engine": "sqlite" },
      "ReverseProxy": { "TrustedHTTPProxies": [], "TrustedPeers": ["0.0.0.0/0"] }
    }
