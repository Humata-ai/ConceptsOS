apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NetBird control plane: management + signal + dashboard + coturn.
# Applied by an overlay under k8s/overlays/netbird-*/ that supplies:
#   - namespace
#   - configMapGenerator (mgmt.env)
#   - secretGenerator    (oidc.env, coturn.env)
#   - image tags

resources:
  - management.yaml
  - signal.yaml
  - dashboard.yaml
  - coturn.yaml
  - management-config-template.yaml
