# One customer's app pod, NetBird-flavored (VPN_MODE=netbird-node).
# Runs the netbird agent + Next.js and joins the shared NetBird management
# plane at $NB_MANAGEMENT_URL using a setup key issued at signup.
#
# Same shape as k8s/base/node/ but for the new stack:
#   - Interface `wt0` instead of `tailscale0`.
#   - HOSTNAME is the NetBird WgIP.
#   - No Service — reachable only via NetBird overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conceptsos-node
  labels:
    app: conceptsos-node
    role: node
    overlay: netbird
spec:
  replicas: 1
  strategy:
    type: Recreate  # /dev/net/tun is single-consumer
  selector:
    matchLabels:
      app: conceptsos-node
      overlay: netbird
  template:
    metadata:
      labels:
        app: conceptsos-node
        role: node
        overlay: netbird
    spec:
      containers:
        - name: node
          image: conceptsos-vpn:latest
          imagePullPolicy: Always
          env:
            - name: VPN_MODE
              value: "netbird-node"
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: conceptsos-node-nb-secret
                  key: NB_SETUP_KEY
          envFrom:
            - configMapRef:
                name: conceptsos-node-nb-config
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/conceptsos-vpn
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          emptyDir: {}
