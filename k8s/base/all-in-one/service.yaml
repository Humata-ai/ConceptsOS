apiVersion: v1
kind: Service
metadata:
  name: conceptsos
  labels:
    app: conceptsos
spec:
  # Public LB, but ONLY for headscale. The Next.js app runs on the tailnet
  # interface inside the pod (100.64.x.x:3000) and has no Service — the
  # only way to reach it is to be a tailnet peer.
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: conceptsos
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: http-acme
      # Kept open only for Let's Encrypt HTTP-01 challenge. Headscale
      # redirects everything else to HTTPS.
      port: 80
      targetPort: 80
      protocol: TCP
