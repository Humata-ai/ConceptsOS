apiVersion: apps/v1
kind: Deployment
metadata:
  name: conceptsos
  labels:
    app: conceptsos
spec:
  replicas: 1
  strategy:
    # SQLite backend forces a single replica; recreate on updates to avoid
    # two pods opening the DB at once.
    type: Recreate
  selector:
    matchLabels:
      app: conceptsos
  template:
    metadata:
      labels:
        app: conceptsos
    spec:
      containers:
        - name: conceptsos
          # Rewritten by kustomize (see k8s/kustomization.yaml -> images:).
          image: conceptsos-vpn:latest
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 443
            - name: http-acme
              containerPort: 80
          # All per-deployment config lives in k8s/config.env, exposed as
          # a ConfigMap. No hostnames or URLs are hardcoded in this file.
          envFrom:
            - configMapRef:
                name: conceptsos-config
          # Real TUN device so Next.js can bind to the tailnet IP.
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/conceptsos-vpn
          # TCP probes only. We cannot do an HTTPS semantic probe because
          # autocert refuses TLS handshakes without SNI, and we cannot do
          # HTTP because port 80 is only the ACME challenge handler. TCP is
          # enough to prove headscale is bound; once the pod is Ready the
          # LB routes traffic, Let's Encrypt reaches port 80, and TLS starts
          # working on port 443.
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          # Persist cert cache + headscale DB across restarts. For SQLite +
          # single replica this is fine as an ephemeral emptyDir for now,
          # but on Recreate the ACME cert survives via the state on the
          # pod's lifetime; consider swapping to a PVC for real durability.
          emptyDir: {}
