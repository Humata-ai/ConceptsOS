apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for one instance of the all-in-one image. This directory
# is NOT applied directly — use an overlay under k8s/overlays/<name>/ that
# supplies:
#   - namespace
#   - configMapGenerator (config.env)
#   - image tag
#
# See k8s/overlays/dans-computer for the reference example.

resources:
  - deployment.yaml
  - service.yaml
