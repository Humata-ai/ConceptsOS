# Shared control-plane: one headscale for all customers.
#
# This pod runs *only* headscale. Customer app pods (see k8s/base/node/)
# join this tailnet via HEADSCALE_SERVER_URL + a preauth key minted at
# customer signup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  labels:
    app: headscale
    role: control
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite forces single writer
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
        role: control
    spec:
      containers:
        - name: headscale
          image: conceptsos-vpn:latest
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 443
            - name: http-acme
              containerPort: 80
          env:
            - name: VPN_MODE
              value: "control"
          envFrom:
            - configMapRef:
                name: control-config
          volumeMounts:
            - name: state
              mountPath: /var/lib/conceptsos-vpn
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: state
          # TODO: PVC for durable headscale DB + cert cache. emptyDir is
          # fine for the demo; loses tailnet identity on pod restart.
          emptyDir: {}
