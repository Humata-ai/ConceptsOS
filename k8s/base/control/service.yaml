apiVersion: v1
kind: Service
metadata:
  name: headscale
  labels:
    app: headscale
    role: control
spec:
  type: LoadBalancer
  # Cluster (not Local): with Local, pods on the same node as the
  # headscale pod cannot hairpin back through the external LB IP
  # (customer node pods → hs.conceptsos.com times out). Headscale does
  # not need real client IPs, so preservation isn't worth the breakage.
  externalTrafficPolicy: Cluster
  selector:
    app: headscale
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: http-acme
      port: 80
      targetPort: 80
      protocol: TCP
