# NetBird ACL policy — source-group → destination-group.
#
# Applied by `bin/apply-policies.sh`. Semantics:
#   - Any group named here that doesn't already exist is created (empty).
#   - Membership is populated at signup time by `bin/provision-nb.sh`
#     (each customer gets `cust-<name>` as their auto_group).
#   - Users in the `humata-admins` group are members of every customer
#     group via a management-side rule (see rollout doc).
#
# Default is default-deny — NetBird only allows what is explicitly listed.
# The `deny-cross-customer` policy is redundant but declared for clarity
# and as a canary during migration.

policies:

  # Admins can reach every customer overlay (for support / debugging).
  - name: admins-to-customers
    description: "humata-admins can reach any cust-* peer on the app port."
    action: accept
    protocol: tcp
    bidirectional: true
    sources:
      - humata-admins
    destinations:
      - customers-all
    ports: ["3000", "22"]

  # Each customer's own peers can reach each other (intra-tenant only).
  # NetBird evaluates one policy per source group; we express this as
  # a single policy per customer in production, generated by
  # bin/provision-nb.sh. This is the pilot canary.
  - name: dans-computer-intra
    description: "dans-computer peers can reach each other on the app port."
    action: accept
    protocol: tcp
    bidirectional: true
    sources:
      - cust-dans-computer
    destinations:
      - cust-dans-computer
    ports: ["3000"]

  # Explicit deny between customer groups. Belt-and-braces on top of
  # NetBird's default-deny — if this ever fires and blocks a legit flow,
  # something else added an accept-all it shouldn't have.
  - name: deny-cross-customer
    description: "Explicit default-deny between customers; canary."
    action: drop
    protocol: all
    bidirectional: true
    sources:
      - customers-all
    destinations:
      - customers-all
